name: Bug report
description: Something in Virasat is broken or behaves wrongly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Please don't include real account numbers, policy numbers or personal details. Use the sample data for screenshots."
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: The steps you took, what you expected, and what happened instead. Drag a screenshot into this box (images up to 10 MB).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: Filled in automatically when you report from the app.
