name: Idea or feature request
description: Suggest something Virasat should do
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: details
    attributes:
      label: Your idea
      description: What would you like Virasat to do, and how would it help you or your family? You can drag in a screenshot or sketch (images up to 10 MB).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: Filled in automatically when you report from the app.
