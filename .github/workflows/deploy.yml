# Builds Virasat, runs the end-to-end test, and publishes dist/site to GitHub Pages.
# Because gauravkhurana.com is the custom domain of the user site (gauravkhuraana.github.io),
# this project site is served at https://gauravkhurana.com/virasat/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium for the test
        run: npx playwright install --with-deps chromium

      - name: End-to-end test
        run: node tests/e2e.js

      - name: Upload test screenshots and exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-out/
          retention-days: 7

      - name: Package site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
